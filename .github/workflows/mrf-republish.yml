name: MRF republish (reuse a run's extract)

# Re-runs only the merge-and-publish step against the shard artifacts of an earlier "MRF extract" run (artifacts are
# kept 7 days), so a publish failure doesn't cost another full extraction. Trigger: put the run id in
# .github/mrf-republish.txt and push, or run it by hand with the id.
on:
  push:
    branches: [main]
    paths: [".github/mrf-republish.txt"]
  workflow_dispatch:
    inputs:
      run_id: { description: "MRF extract run id whose artifacts to publish", required: true }

permissions:
  contents: write
  actions: read

concurrency: { group: mrf-extract, cancel-in-progress: false }

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: pip install duckdb==1.1.3
      - id: src
        run: echo "run=${{ inputs.run_id || '' }}$( [ -z '${{ inputs.run_id }}' ] && grep -o '[0-9]\+' .github/mrf-republish.txt | head -1 )" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: artifacts, run-id: "${{ steps.src.outputs.run }}", github-token: "${{ github.token }}" }
      - name: Merge by carrier
        run: python3 scripts/mrf-publish.py artifacts release
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="mrf-$(jq -r .month artifacts/inputs/plan.json)"
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes --cleanup-tag
          gh release create "$TAG" release/* --title "Negotiated rates extract ${TAG#mrf-}" --notes-file release/NOTES.md --latest=false
